name: Oracle ARM Hunter Python Edition

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install OCI SDK
        run: pip install oci

      - name: Run Hunting Script
        env:
          PYTHONUNBUFFERED: "1"
          # Thêm dấu ngoặc kép để bảo vệ an toàn tuyệt đối cho file Secret
          OCI_USER: "${{ secrets.OCI_USER_OCID }}"
          OCI_TENANCY: "${{ secrets.OCI_TENANCY_OCID }}"
          OCI_FINGERPRINT: "${{ secrets.OCI_FINGERPRINT }}"
          OCI_REGION: "${{ secrets.OCI_REGION }}"
          OCI_KEY_CONTENT: "${{ secrets.OCI_KEY_FILE }}"
          OCI_SSH_PUB: "${{ secrets.OCI_SSH_PUB }}"
        run: |
          python - <<EOF
          import oci
          import os
          import time
          from datetime import datetime

          # Hàm tự động gọt sạch mọi khoảng trắng/xuống dòng thừa
          def clean(val): return val.strip() if val else ""

          with open("private_key.pem", "w") as f:
              f.write(os.getenv("OCI_KEY_CONTENT", ""))

          config = {
              "user": clean(os.getenv("OCI_USER")),
              "fingerprint": clean(os.getenv("OCI_FINGERPRINT")),
              "tenancy": clean(os.getenv("OCI_TENANCY")),
              "region": clean(os.getenv("OCI_REGION")),
              "key_file": "./private_key.pem"
          }

          AD = "YhCu:AP-SINGAPORE-1-AD-1 ".strip()
          SHAPE = "VM.Standard.A1.Flex".strip()
          
          # Đảm bảo bạn dán ĐÚNG mã Subnet và Image của bạn ở 2 dòng dưới này nhé:
          IMAGE_ID = "ocid1.image.oc1.ap-singapore-1.aaaaaaaaovl4wfgvifzemo53rqy4dbotsx2xsus7y6j374urnxfrjhijkfqq ".strip()
          SUBNET_ID = "ocid1.subnet.oc1.ap-singapore-1.aaaaaaaad5bcepewnlhqqckbxnyf64f5yg4daxqfnze3etwp3hfek62pkfda".strip()
          SSH_PUB = clean(os.getenv("OCI_SSH_PUB"))

          compute_client = oci.core.ComputeClient(config)

          instance_details = oci.core.models.LaunchInstanceDetails(
              compartment_id=config["tenancy"],
              availability_domain=AD,
              shape=SHAPE,
              # SỬA LỖI 400: Ép chuẩn kiểu Float (2.0 và 12.0)
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(ocpus=float(2.0), memory_in_gbs=float(12.0)),
              display_name="ARQ-RAG-Server",
              source_details=oci.core.models.InstanceSourceViaImageDetails(source_type="image", image_id=IMAGE_ID),
              create_vnic_details=oci.core.models.CreateVnicDetails(assign_public_ip=True, subnet_id=SUBNET_ID),
              # Sửa lỗi 400 do SSH Key rỗng
              metadata={"ssh_authorized_keys": SSH_PUB} if SSH_PUB else {}
          )

          print(f"[{datetime.now().strftime('%H:%M:%S')}] Bắt đầu đợt săn máy ARM...")

          start_time = time.time()
          # Cắm cọc liên tục trong 14 phút
          while time.time() - start_time < 3300: 
              try:
                  response = compute_client.launch_instance(instance_details)
                  print(f"🎉 THÀNH CÔNG! ID máy: {response.data.id}")
                  exit(0)
              except oci.exceptions.ServiceError as e:
                  # Bắt đúng lỗi Hết tài nguyên (Capacity)
                  if e.status == 429 or e.status == 500 or "capacity" in e.message.lower() or "limit" in e.message.lower():
                      print(f"[{datetime.now().strftime('%H:%M:%S')}] Server Oracle báo hết chỗ. Cắm cọc chờ 30 giây rồi đòi tiếp...")
                      time.sleep(45)
                  else:
                      print(f"❌ Lỗi API ({e.status}): {e.message}")
                      exit(1)
              except Exception as e:
                  print(f"❌ Lỗi hệ thống: {str(e)}")
                  exit(1)
          print("Hết thời gian chờ 14 phút. GitHub sẽ tự động chạy đợt mới!")
          EOF
