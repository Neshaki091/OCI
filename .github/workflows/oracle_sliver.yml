name: Oracle ARM Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install OCI CLI
        run: |
          pip install oci-cli

      - name: Create Config File
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=${{ secrets.OCI_REGION }}" >> ~/.oci/config
          echo "key_file=~/.oci/key.pem" >> ~/.oci/config
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem

      - name: Run Launch Script
        run: |
          # 1. Tự động dọn dẹp khoảng trắng/xuống dòng thừa trong OCID
          COMPARTMENT_ID=$(echo "${{ secrets.OCI_TENANCY_OCID }}" | tr -d '[:space:]')
          
          # 2. Lưu SSH Key ra file chuẩn (Tránh lỗi ảo hóa của Bash)
          echo "${{ secrets.OCI_SSH_PUB }}" > ssh_key.pub
          
          # 3. Lưu cấu hình RAM/CPU ra file JSON (Sửa triệt để lỗi CannotParseRequest)
          echo '{"ocpus": 2, "memoryInGBs": 12}' > shape.json
          
          # 4. Gửi lệnh săn máy chuẩn xác 100%
          oci compute instance launch \
            --availability-domain "UoXp:AP-SINGAPORE-1-AD-1" \
            --compartment-id "$COMPARTMENT_ID" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config file://shape.json \
            --image-id "ocid1.image.oc1.ap-singapore-1.aaaaaaaaidxm5n3z2v5p2z5qzn6j7j3y2m3u2i2e2n2o2r2t2s2u2v2x2y2z" \
            --subnet-id "ocid1.subnet.oc1.ap-singapore-1.aaaaaaaad5bcepewnlhqqckbxnyf64f5yg4daxqfnze3etwp3hfek62pkfda" \
            --assign-public-ip true \
            --display-name "ARQ-RAG-Server" \
            --ssh-authorized-keys-file ssh_key.pub
